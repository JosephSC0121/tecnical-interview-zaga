[project]
name = "project-editor-backend"
version = "0.1.0"
description = "Stateless editing layer in front of the upstream records API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff",
    "pyright",
    "records-api",
]

[tool.uv]
package = false

[tool.uv.sources]
records-api = { path = "../upstream" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
src = ["."]

[tool.ruff.lint]
extend-select = ["I", "B", "UP"]

[tool.pyright]
include = ["app", "tests"]
